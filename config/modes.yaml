# ============================================================
# Режимы торговли — Elliott Wave Project
# ============================================================

swing:
  name: "Свинг (H4/D1)"
  description: "Свинг-трейдинг: сделки держатся дни-недели"
  timeframes: ['H4', 'D1']
  zigzag_length: 5
  impulse_atr: 2.0
  diagonal_atr: 1.0
  correction_atr: 1.0
  max_bars_hold: 50
  use_mtf_filter: false
  use_trailing_stop: false
  strategies: ['w2_w3', 'w4_w5', 'wc_reversal', 'w5_divergence', 'mtf_confirmed', 'combined']

position:
  name: "Позиционный (D1/W1)"
  description: "Позиционная торговля: сделки держатся недели-месяцы"
  timeframes: ['D1', 'W1']
  zigzag_length: 8
  impulse_atr: 2.5
  diagonal_atr: 1.5
  correction_atr: 1.5
  max_bars_hold: 100
  use_mtf_filter: false
  use_trailing_stop: false
  strategies: ['w2_w3', 'w4_w5', 'wc_reversal', 'w5_divergence', 'mtf_confirmed', 'combined']

intraday:
  name: "Интрадей (M30/H1)"
  description: "Внутридневная торговля: сделки держатся часы"
  timeframes: ['M30', 'H1']
  zigzag_length: 5
  impulse_atr: 1.5
  diagonal_atr: 1.0
  correction_atr: 1.0
  max_bars_hold: 20
  use_mtf_filter: true
  mtf_timeframe: 'H4'
  # Уменьшенные цели
  target_w2_w3: 1.272
  target_w4_w5: 0.786
  # Trailing stop
  use_trailing_stop: true
  trailing_trigger: 0.5
  trailing_distance: 0.3
  # Стратегии (без wc_reversal)
  strategies: ['w2_w3', 'w4_w5', 'w5_divergence', 'mtf_confirmed', 'combined']